name: netzdoku

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netzdoku
      POSTGRES_USER: netzdoku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - db-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netzdoku -d netzdoku"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ConnectionStrings__NetzDoku: "Host=db;Port=5432;Database=netzdoku;Username=netzdoku;Password=${POSTGRES_PASSWORD}"
      Ablage__Pfad: /daten/plaene
    volumes:
      - plan-ablage:/daten/plaene
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      LOGIN_USER: ${LOGIN_USER:?LOGIN_USER in .env setzen}
      LOGIN_PASSWORD_HASH: ${LOGIN_PASSWORD_HASH:?LOGIN_PASSWORD_HASH in .env setzen}
    volumes:
      - caddy-daten:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  db-daten:
  plan-ablage:
  caddy-daten:
  caddy-config:
